[package]
name = "aw-graph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reads NDJSON (observations + events) from stdin and writes a Layer 3 graph (DOT + JSON)."

[[bin]]
name = "aw-graph"
path = "src/main.rs"

[dependencies]
