[package]
name = "aw-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Window/UI source adapter (NSWorkspace frontmost-app diff). Layer 1."

[dependencies]
aw-core = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
